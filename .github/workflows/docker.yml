name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BOT_TOKEN: dummy-token
  OWNER_ID: "123456789"
  SHIKI_USER: dummy-user

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t shikiupdatesbot .

      - name: Smoke-import application configuration
        run: >-
          docker run --rm
          -e BOT_TOKEN
          -e OWNER_ID
          -e SHIKI_USER
          shikiupdatesbot
          python -c "import config"

  docker-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate docker-compose.yml and required environment
        run: |
          printf '%s\n' 'DISPLAY_NAME=dummy-display' > .env
          docker compose config --format json > compose.json
          python -c "import json; data=json.load(open('compose.json')); env=data['services']['ShikiUpdatesBot']['environment']; expected={'BOT_TOKEN': 'dummy-token', 'OWNER_ID': '123456789', 'SHIKI_USER': 'dummy-user', 'DISPLAY_NAME': 'dummy-display', 'DATA_DIR': '/data'}; assert all(env.get(key) == value for key, value in expected.items()), env"
