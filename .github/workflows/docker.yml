name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BOT_TOKEN: dummy-token
  OWNER_ID: "123456789"
  SHIKI_USER: dummy-user

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t shikiupdatesbot .

      - name: Smoke-import application and bundled resources
        run: |
          docker run --rm \
            -e BOT_TOKEN \
            -e OWNER_ID \
            -e SHIKI_USER \
            shikiupdatesbot \
            python -c '
          from pathlib import Path
          import config
          import main
          import project_meta
          import runtime
          from main_menu import MAIN_MENU_ASSETS

          assert runtime.APP_ROOT == runtime.RESOURCE_ROOT == Path("/app")
          assert config.DATA_DIR == Path("/data")
          required = (
              "assets/info-preview.png",
              "assets/report-poster-placeholder-v1.png",
              "assets/report-poster-placeholder-v2.jpg",
              "examples/facts.json",
              *(f"assets/main-menu/{name}" for name in MAIN_MENU_ASSETS.values()),
          )
          assert all((runtime.RESOURCE_ROOT / name).is_file() for name in required)
          '

  docker-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate docker-compose.yml and required environment
        run: |
          printf '%s\n' 'DISPLAY_NAME=dummy-display' > .env
          docker compose config --format json > compose.json
          python -c "import json; data=json.load(open('compose.json')); env=data['services']['ShikiUpdatesBot']['environment']; expected={'BOT_TOKEN': 'dummy-token', 'OWNER_ID': '123456789', 'SHIKI_USER': 'dummy-user', 'DISPLAY_NAME': 'dummy-display', 'DATA_DIR': '/data'}; assert all(env.get(key) == value for key, value in expected.items()), env"
