name: Python dependency submission

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - "requirements-build.txt"
      - ".github/scripts/submit_dependency_snapshot.py"
      - ".github/scripts/validate_dependency_submission.py"
      - ".github/workflows/dependency-submission.yml"

# Dependency submission API требует contents: write. Существующие workflows остаются read-only.
permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  submit-python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve runtime dependencies
        run: python -m pip install --disable-pip-version-check --dry-run --ignore-installed --report dependency-report-runtime.json --requirement requirements.txt

      - name: Resolve development dependencies
        run: python -m pip install --disable-pip-version-check --dry-run --ignore-installed --report dependency-report-dev.json --requirement requirements-dev.txt

      - name: Resolve build dependencies
        run: python -m pip install --disable-pip-version-check --dry-run --ignore-installed --report dependency-report-build.json --requirement requirements-build.txt

      - name: Build resolved Python dependency snapshot
        run: python .github/scripts/submit_dependency_snapshot.py build dependency-snapshot.json

      - name: Validate resolved Python dependency snapshot
        run: python .github/scripts/validate_dependency_submission.py dependency-snapshot.json

      - name: Submit resolved Python dependency snapshot
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: python .github/scripts/submit_dependency_snapshot.py submit dependency-snapshot.json
