name: Windows executable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.py"
      - "requirements*.txt"
      - "ShikiUpdatesBot.spec"
      - "assets/**"
      - "README-Windows.txt"
      - ".github/workflows/windows-exe.yml"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    env:
      APP_REPOSITORY: ${{ vars.UPDATE_REPOSITORY || github.repository }}
      APP_SERVER_URL: ${{ github.server_url }}
      APP_API_URL: ${{ github.api_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Resolve and validate build version
        id: version
        shell: pwsh
        run: |
          $projectVersion = (python -c "from project_meta import PROJECT_VERSION; print(PROJECT_VERSION)").Trim()
          if ($env:GITHUB_REF -like "refs/tags/*") {
            if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw "Release tag must be strict SemVer: vMAJOR.MINOR.PATCH"
            }
            if ($env:GITHUB_REF_NAME -ne $projectVersion) {
              throw "Release tag $env:GITHUB_REF_NAME does not match project version $projectVersion"
            }
            $buildVersion = $env:GITHUB_REF_NAME
          } else {
            $buildVersion = "$projectVersion-dev"
          }
          $isRelease = (
            $env:GITHUB_EVENT_NAME -eq "push" -and
            $env:GITHUB_REF -like "refs/tags/*"
          ).ToString().ToLowerInvariant()
          "APP_VERSION=$buildVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$buildVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "is_release=$isRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build one-file executable
        run: pyinstaller --clean --noconfirm ShikiUpdatesBot.spec

      - name: Smoke portable first run
        shell: pwsh -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $firstRun = Join-Path $env:RUNNER_TEMP "shikiupdatesbot-first-run"
          New-Item -ItemType Directory -Force -Path $firstRun | Out-Null
          Copy-Item .\dist\ShikiUpdatesBot.exe $firstRun
          Copy-Item .\.env.example $firstRun
          Push-Location $firstRun
          try {
            & .\ShikiUpdatesBot.exe
            $exitCode = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($exitCode -ne 2 -or -not (Test-Path "$firstRun\.env")) {
            throw "Frozen first-run bootstrap failed (exit=$exitCode)"
          }
          exit 0

      - name: Smoke version and configuration
        shell: pwsh
        env:
          BOT_TOKEN: test-token
          OWNER_ID: "123456"
          SHIKI_USER: test-user
          DATA_DIR: ${{ runner.temp }}\shikiupdatesbot-smoke-data
        run: |
          @"
          BOT_TOKEN=test-token
          OWNER_ID=123456
          SHIKI_USER=test-user
          "@ | Set-Content .\dist\.env -Encoding utf8
          try {
            .\dist\ShikiUpdatesBot.exe --version
            if ($LASTEXITCODE -ne 0) {
              throw "--version failed (exit=$LASTEXITCODE)"
            }
            .\dist\ShikiUpdatesBot.exe --check-config
            if ($LASTEXITCODE -ne 0) {
              throw "--check-config failed (exit=$LASTEXITCODE)"
            }
          } finally {
            Remove-Item .\dist\.env -ErrorAction SilentlyContinue
          }

      - name: Scan release executable with VirusTotal
        id: virustotal
        if: steps.version.outputs.is_release == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          PYTHONUTF8: "1"
        run: |
          python release_security.py .\dist\ShikiUpdatesBot.exe `
            --notes-path .\release\security-notes.md `
            --summary-path $env:GITHUB_STEP_SUMMARY

      - name: Ensure release security notes exist
        if: always() && steps.version.outputs.is_release == 'true'
        shell: pwsh
        run: |
          $notesPath = ".\release\security-notes.md"
          $notesContent = if (Test-Path $notesPath -PathType Leaf) {
            Get-Content $notesPath -Raw
          } else {
            $null
          }
          $notesAreValid = (
            -not [string]::IsNullOrWhiteSpace($notesContent) -and
            $notesContent.TrimStart().StartsWith(
              "<!-- shikiupdatesbot-security-report:start -->"
            ) -and
            $notesContent.TrimEnd().EndsWith(
              "<!-- shikiupdatesbot-security-report:end -->"
            )
          )
          if (-not $notesAreValid) {
            New-Item -ItemType Directory -Force -Path .\release | Out-Null
            $exePath = ".\dist\ShikiUpdatesBot.exe"
            $sha256 = if (Test-Path $exePath) {
              (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
            } else {
              "недоступен"
            }
            # Независимый минимальный fallback обязан работать даже при ошибке импорта Python-модуля.
            $fallback = @"
          <!-- shikiupdatesbot-security-report:start -->
          ### 🛡️ Проверка безопасности

          - **Результат:** автоматический анализ недоступен
          - **Причина:** непредвиденная ошибка интеграции VirusTotal
          - **SHA-256:** ``$sha256``
          <!-- shikiupdatesbot-security-report:end -->
          "@
            $fallback | Set-Content $notesPath -Encoding utf8
            $fallback | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
            Write-Output "::warning::Анализ VirusTotal недоступен: непредвиденная ошибка интеграции"
          }

      - name: Assemble portable ZIP and checksum
        shell: pwsh
        run: |
          $package = "release\ShikiUpdatesBot"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item dist\ShikiUpdatesBot.exe $package
          Copy-Item .env.example $package
          Copy-Item README-Windows.txt $package
          Copy-Item LICENSE "$package\LICENSE.txt"
          $repositoryUrl = "$env:APP_SERVER_URL/$env:APP_REPOSITORY"
          $sourceRepositoryUrl = "$env:APP_SERVER_URL/$env:GITHUB_REPOSITORY"
          (Get-Content "$package\README-Windows.txt" -Raw).Replace(
            "__REPOSITORY_URL__", $repositoryUrl
          ).Replace(
            "__SOURCE_URL__", "$sourceRepositoryUrl/tree/$env:GITHUB_SHA"
          ) | Set-Content "$package\README-Windows.txt" -Encoding utf8
          $archive = "release\ShikiUpdatesBot-windows-x64.zip"
          Compress-Archive -Path $package -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content "$archive.sha256" -Encoding ascii

      - name: Upload verification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ShikiUpdatesBot-${{ steps.version.outputs.version }}-windows-x64
          path: |
            release/*.zip
            release/*.sha256
            release/security-notes.md
          if-no-files-found: error

  publish:
    if: needs.build.outputs.is_release == 'true'
    needs: build
    runs-on: windows-2022
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ShikiUpdatesBot-${{ needs.build.outputs.version }}-windows-x64
          path: release

      - name: Create draft GitHub Release
        env:
          APP_VERSION: ${{ needs.build.outputs.version }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $archive = "release\ShikiUpdatesBot-windows-x64.zip"
          $checksum = "$archive.sha256"
          gh release create $env:APP_VERSION $archive $checksum `
            --verify-tag --draft `
            --notes-file .\release\security-notes.md `
            --title "ShikiUpdatesBot $env:APP_VERSION"
